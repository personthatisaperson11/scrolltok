#toast {

/* MOBILE */

@media(max-width: 950px) {
  .layout {
    grid-template-columns: 80px minmax(300px, 650px);

  .sidebar {

  }

  }

</style>

<body>

  <div class="loginBox">

    <input id="loginName" class="input" placeholder="username">

    <button class="primary" onclick="login()">log in</button>

    >

    <div class="topActions">

<div id="toast"></div>

<!-- SIGNUP MODAL -->

<div id="signupModal" class="modal hidden">
  <div class="modalBox">
    <button class="close" onclick="closeModal('signupModal')">×</button>

    <h2>create your account ✨</h2>

    <input id="signupName" class="input" placeholder="username">
    <input id="signupPass" class="input" type="password" placeholder="password">

    <button class="primary" onclick="createAccount()">
      create account
    </button>
  </div>
</div>

<script>

/* =========================
   DATA
========================= */

let db = JSON.parse(localStorage.getItem("scrolltokDB")) || {
  users: [
    {
      username: "orii",
      password: "cats",
      emoji: "🐱",
      bio: "professional internet creature",
      friends: ["orii"],
      posts: []
    },
    {
      username: "gerald_the_goober",
      password: "lion",
      emoji: "🦁",
      bio: "i have no idea what i'm doing",
      friends: [],
      posts: []
    },
    {
      username: "bananafan9000",
      password: "banana",
      emoji: "🍌",
      bio: "banana enthusiast",
      friends: [],
      posts: []
    },
    {
      username: "tiny_pickle",
      password: "pickle",
      emoji: "🥒",
      bio: "small but powerful",
      friends: [],
      posts: []
    }
  ],
  posts: [
    {
      id: 1,
      username: "gerald_the_goober",
      text: "i tried to make a sandwich and somehow created a national emergency",
      emoji: "🥪",
      likes: 12,
      likedBy: [],
      comments: [
        {
          user: "bananafan9000",
          text: "how do you even do that 😭",
          reply: "gerald_the_goober",
          replyText: "i don't know either bro"
        }
      ]
    },
    {
      id: 2,
      username: "bananafan9000",
      text: "the banana has been located.",
      emoji: "🍌",
      likes: 31,
      likedBy: [],
      comments: [
        {
          user: "tiny_pickle",
          text: "WHERE",
          reply: "bananafan9000",
          replyText: "under the couch 😭"
        }
      ]
    },
    {
      id: 3,
      username: "orii",
      text: "my cat looked at me for 7 seconds and then walked away",
      emoji: "🐈",
      likes: 48,
      likedBy: [],
      comments: []
    }
  ],
  notifications: []
};

let currentUser = localStorage.getItem("scrolltokCurrent");

function saveDB() {
  localStorage.setItem("scrolltokDB", JSON.stringify(db));
}

function getUser(name) {
  return db.users.find(u => u.username === name);
}

/* =========================
   LOGIN
========================= */

function login() {

  const name = document.getElementById("loginName").value.trim();
  const pass = document.getElementById("loginPass").value;

  const user = getUser(name);

  if (!user || user.password !== pass) {
    alert("wrong username or password 😭");
    return;
  }

  currentUser = name;
  localStorage.setItem("scrolltokCurrent", name);

  startApp();
}

function showSignup() {
  document.getElementById("signupModal").classList.remove("hidden");
}

function createAccount() {

  const name = document.getElementById("signupName").value.trim();
  const pass = document.getElementById("signupPass").value;

  if (!name || !pass) {
    alert("you need a username AND password 😭");
    return;
  }

  if (db.users.some(u => u.username.toLowerCase() === name.toLowerCase())) {
    alert("that username is already taken!");
    return;
  }

  db.users.push({
    username: name,
    password: pass,
    emoji: "😎",
    bio: "new here 👋",
    friends: [name],
    posts: []
  });

  saveDB();

  currentUser = name;
  localStorage.setItem("scrolltokCurrent", name);

  closeModal("signupModal");
  startApp();
}

function logout() {
  currentUser = null;
  localStorage.removeItem("scrolltokCurrent");

  document.getElementById("app").classList.add("hidden");
  document.getElementById("loginScreen").classList.remove("hidden");
}

/* =========================
   START APP
========================= */

function startApp() {

  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");

  updateMiniProfile();
  showPage("home");
  renderSuggestions();
}

function updateMiniProfile() {

  const user = getUser(currentUser);

  if (!user) return;

  document.getElementById("miniName").textContent = user.username;
  document.getElementById("miniHandle").textContent = "@" + user.username;
  document.getElementById("miniAvatar").textContent = user.emoji;
}

/* =========================
   NAVIGATION
========================= */

function showPage(page) {

  const main = document.getElementById("mainContent");

  if (page === "home") renderHome();
  if (page === "search") renderSearchPage();
  if (page === "creator") renderCreator();
  if (page === "friends") renderFriends();
  if (page === "profile") renderProfile(currentUser);
}

/* =========================
   HOME
========================= */

function renderHome() {

  let html = `
    <div class="storyRow">
      ${db.users.map(u => `
        <div class="story" onclick="renderProfile('${u.username}')">
          <div class="avatar">${u.emoji}</div>
          ${u.username}
        </div>
      `).join("")}
    </div>

    <div class="createPost">
      <textarea id="newPostText" placeholder="what questionable thing happened today?"></textarea>
      <button class="primary" onclick="makePost()">post something</button>
    </div>
  `;

  db.posts.slice().reverse().forEach(post => {
    html += renderPost(post);
  });

  document.getElementById("mainContent").innerHTML = html;
}

function renderPost(post) {

  const user = getUser(post.username);
  const liked = post.likedBy.includes(currentUser);

  return `
    <article class="post">

      <div class="postHeader">
        <div class="userRow" onclick="renderProfile('${post.username}')"
             style="cursor:pointer">

          <div class="avatar">${user?.emoji || "🙂"}</div>

          <div>
            <div class="username">${post.username}</div>
            <div class="handle">posted something suspicious</div>
          </div>
        </div>

        ${post.username === currentUser
          ? `<button class="secondary" onclick="deletePost(${post.id})">🗑️</button>`
          : ""}
      </div>

      <div class="postText">${escapeHTML(post.text)}</div>

      <div class="fakeVideo">
        ${post.emoji || "🎥"}
        <span>scrolltok original™</span>
      </div>

      <div class="postActions">

        <button class="action ${liked ? "liked" : ""}"
          onclick="toggleLike(${post.id})">
          ${liked ? "❤️" : "🤍"} ${post.likes}
        </button>

        <button class="action"
          onclick="focusComment(${post.id})">
          💬 ${post.comments.length}
        </button>

        <button class="action"
          onclick="toast('shared with absolutely nobody')">
          ↗️ share
        </button>

      </div>

      <div>
        ${post.comments.map(c => `
          <div class="comment">
            <b>${c.user}</b> ${escapeHTML(c.text)}

            ${c.replyText ? `
              <div class="commentReply">
                <b>${c.reply}</b> ${escapeHTML(c.replyText)}
              </div>
            ` : ""}
          </div>
        `).join("")}
      </div>

      <div class="commentBox">
        <input
          id="comment-${post.id}"
          placeholder="say something..."
          onkeydown="if(event.key==='Enter') addComment(${post.id})"
        >
        <button class="secondary"
          onclick="addComment(${post.id})">send</button>
      </div>

    </article>
  `;
}

function makePost() {

  const text = document.getElementById("newPostText").value.trim();

  if (!text) return;

  db.posts.push({
    id: Date.now(),
    username: currentUser,
    text,
    emoji: "📸",
    likes: 0,
    likedBy: [],
    comments: []
  });

  saveDB();
  renderHome();
  toast("posted!! 📸");
}

function deletePost(id) {

  db.posts = db.posts.filter(p => p.id !== id);

  saveDB();
  renderHome();
}

function toggleLike(id) {

  const post = db.posts.find(p => p.id === id);
  if (!post) return;

  if (post.likedBy.includes(currentUser)) {
    post.likedBy = post.likedBy.filter(x => x !== currentUser);
    post.likes--;
  } else {
    post.likedBy.push(currentUser);
    post.likes++;

    if (post.username !== currentUser) {
      db.notifications.push(
        `${currentUser} liked your post ❤️`
      );
    }
  }

  saveDB();
  renderHome();
}

function addComment(id) {

  const input = document.getElementById("comment-" + id);
  const text = input.value.trim();

  if (!text) return;

  const post = db.posts.find(p => p.id === id);

  post.comments.push({
    user: currentUser,
    text,
    reply: post.username,
    replyText: generateReply(text, post.text)
  });

  if (post.username !== currentUser) {
    db.notifications.push(
      `${currentUser} commented on your post 💬`
    );
  }

  saveDB();
  renderHome();
}

function focusComment(id) {
  setTimeout(() => {
    document.getElementById("comment-" + id)?.focus();
  }, 100);
}

/* =========================
   FUNNY REPLIES
========================= */

function generateReply(comment, postText) {

  const c = comment.toLowerCase();
  const p = postText.toLowerCase();

  if (c.includes("cat") || p.includes("cat")) {
    const replies = [
      "he knows exactly what he did 😭",
      "the cat has refused to comment",
      "he's currently plotting something",
      "cat behavior unfortunately"
    ];
    return random(replies);
  }

  if (c.includes("why")) {
    return random([
      "excellent question. i have absolutely no answer.",
      "i ask myself this every day",
      "because apparently we make bad decisions here",
      "honestly i was wondering the same thing 😭"
    ]);
  }

  if (c.includes("where")) {
    return random([
      "probably under the couch",
      "i lost it approximately 4 minutes ago",
      "somewhere it definitely should not be",
      "check behind the suspicious object"
    ]);
  }

  if (c.includes("lol") || c.includes("haha") || c.includes("😭")) {
    return random([
      "glad someone understands",
      "this situation is becoming increasingly serious",
      "i'm choosing to take that as a compliment",
      "😭 exactly"
    ]);
  }

  if (c.includes("bro")) {
    return random([
      "bro.",
      "BRO 😭",
      "i know bro",
      "we're cooked"
    ]);
  }

  return random([
    "real",
    "that's actually so true 😭",
    "i was thinking the exact same thing",
    "this is the most reasonable comment i've received today",
    "noted. adding this to the investigation.",
    "you might be onto something",
    "honestly? valid."
  ]);
}

function searchUsers() {

  const query = document.getElementById("searchInput").value.trim().toLowerCase();

  if (!query) {
    showPage("home");
    return;
  }

  const matches = db.users.filter(u =>
    u.username.toLowerCase().includes(query)
  );

  document.getElementById("mainContent").innerHTML = `
    <h2>🔎 search results</h2>

    ${
      matches.length
      ? matches.map(u => searchUserCard(u)).join("")
      : `<div class="post">no users found 😭</div>`
    }
  `;
}

function renderSearchPage() {

  document.getElementById("mainContent").innerHTML = `
    <div class="post">

      <p>type a username in the search bar above!</p>
      <p>yes, you can search for yourself. no, we won't stop you.</p>
    </div>
  `;
}

function searchUserCard(user) {

  const me = getUser(currentUser);
  const isFriend = me.friends.includes(user.username);

  return `
    <div class="searchResult">

      <div class="userRow"
        onclick="renderProfile('${user.username}')"
        style="cursor:pointer">

        <div class="avatar">${user.emoji}</div>

        <div>
          <div class="username">${user.username}</div>
          <div class="handle">${user.bio}</div>
        </div>

      </div>

      <button class="${isFriend ? "secondary" : "primary"}"
        style="width:auto;margin:0"
        onclick="toggleFriend('${user.username}')">

        ${isFriend ? "✓ friends" : "➕ friend"}

      </button>

    </div>
  `;
}

/* =========================
   FRIENDS
========================= */

function toggleFriend(name) {

  const me = getUser(currentUser);

  if (me.friends.includes(name)) {
    me.friends = me.friends.filter(x => x !== name);
    toast("unfriended 😔");
  } else {
    me.friends.push(name);

    if (name !== currentUser) {
      db.notifications.push(
        `${currentUser} became your friend 👥`
      );
    }

    toast("FRIEND ADDED 👥");
  }

  saveDB();

  searchUsers();
  renderFriends();
}

function renderFriends() {

  const me = getUser(currentUser);

  document.getElementById("mainContent").innerHTML = `
    <h2>👥 your friends</h2>

    ${
      me.friends.map(name => {
        const u = getUser(name);

        return `
          <div class="searchResult">

            <div class="userRow"
              onclick="renderProfile('${u.username}')"
              style="cursor:pointer">

              <div class="avatar">${u.emoji}</div>

              <div>
                <div class="username">${u.username}</div>
                <div class="handle">@${u.username}</div>
              </div>

            </div>

            <span>👥</span>

          </div>
        `;
      }).join("")
      || `<div class="post">you have no friends. tragic.</div>`
    }
  `;
}

========================= */

function renderProfile(name) {

  const user = getUser(name);

  if (!user) return;

  const me = getUser(currentUser);
  const friend = me.friends.includes(name);

  const posts = db.posts.filter(p => p.username === name);

  document.getElementById("mainContent").innerHTML = `

    <div class="profilePage">

      <div class="profileBanner"></div>

      <div class="profileInfo">

        <div class="bigAvatar">${user.emoji}</div>

        <h2>${user.username}</h2>
        <div class="handle">@${user.username}</div>

        <p>${escapeHTML(user.bio)}</p>

        <div class="profileStats">
          <div class="stat">
            <b>${posts.length}</b>
            <span>posts</span>
          </div>

          <div class="stat">
            <b>${user.friends.length}</b>
            <span>friends</span>
          </div>
        </div>

        ${
          name !== currentUser
          ? `
            <button class="primary"
              style="width:auto"
              onclick="toggleFriend('${name}')">
              ${friend ? "✓ friends" : "➕ add friend"}
            </button>
          `
          : `
            <button class="secondary">
              ✏️ edit profile
            </button>
          `
        }

      </div>
    </div>

    <h2 style="margin-top:25px">📸 posts</h2>

    ${
      posts.length
      ? posts.slice().reverse().map(p => renderPost(p)).join("")
      : `<div class="post">this person hasn't posted anything yet 👀</div>`
    }
  `;
}

function setFilter(filter) {

function updatePreview() {

  const preview = document.getElementById("preview");

  if (!preview) return;

  preview.className =
    "editorPreview " +
    editor.filter +
    " " +
    editor.effect;

  preview.innerHTML = `
    <div class="previewEmoji">${editor.emoji}</div>
    ${
      editor.text
      ? `<div class="previewText">${escapeHTML(editor.text)}</div>`
      : ""
    }
  `;
}

function publishVideo() {

  const text = editor.text || "my incredibly important video";

  db.posts.push({
    id: Date.now(),
    username: currentUser,
    text,
    emoji: editor.emoji,
    likes: 0,
    likedBy: [],
    comments: []
  });

  saveDB();

  editor = {
    filter: "filter-normal",
    effect: "",
    text: "",

/* =========================
   HELPERS
========================= */

function random(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function escapeHTML(text) {

  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function closeModal(id) {
  document.getElementById(id).classList.add("hidden");
}

let toastTimer;

function toast(message) {

  const t = document.getElementById("toast");

  t.textContent = message;
  t.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer = setTimeout(() => {
    t.classList.remove("show");
  }, 1800);
}
